<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f5fb"><title>NoxShare</title><link rel="stylesheet" href="style.css"><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20108%20108%22%3E%3Cpath%20fill%3D%22%236555E8%22%20d%3D%22M0%2C0h108v108h-108z%22%2F%3E%3Cpath%20fill%3D%22%23FFFFFF%22%20d%3D%22M27%2C66V39c0%2C-7%208%2C-11%2014%2C-7l26%2C17V32h14v37c0%2C7%20-8%2C11%20-14%2C7L41%2C59v17H27z%22%2F%3E%3C%2Fsvg%3E"></head>
<body><div class="app">
<header class="topbar"><div class="brand"><span class="logo" role="img" aria-label="NoxShare 图标"><svg class="brandmark" viewBox="0 0 108 108" aria-hidden="true"><path class="icon-bg" d="M0,0h108v108h-108z"/><path class="icon-n" d="M27,66V39c0,-7 8,-11 14,-7l26,17V32h14v37c0,7 -8,11 -14,7L41,59v17H27z"/></svg></span><div><h1>NoxShare</h1><span id="connection">局域网共享</span></div></div><div class="top-actions"><span class="identity" id="identity">主机</span><button id="more" class="icon-button" aria-label="更多功能" aria-expanded="false" data-icon="more"></button></div></header>
<nav id="menu" class="menu" hidden aria-label="更多功能"><button data-menu="network"><span data-icon="wifi"></span>网络信息</button><button data-menu="all"><span data-icon="folder"></span>全部文件<span id="menu-count">0</span></button><button data-menu="sent"><span data-icon="upload"></span>已发送文件</button><button data-menu="received"><span data-icon="download"></span>已接收文件</button><div class="menu-divider"></div><button data-menu="settings" id="menu-settings"><span data-icon="settings"></span>设置</button><button data-menu="help"><span data-icon="help"></span>使用说明</button><div class="menu-credit">NoxShare · @NoxLeo</div></nav>
<section class="sharing"><button id="sharing-heading" class="sharing-heading" aria-expanded="true"><span class="sharing-label"><i id="sharing-dot"></i><strong id="sharing-title">开启共享</strong><small id="sharing-summary">让设备连接在一起</small></span><span id="sharing-chevron" data-icon="chevron"></span></button><div id="sharing-body"><div class="sharing-top"><p id="sharing-description">连接同一 Wi-Fi，即可互传文件和文字。</p><button id="toggle" class="toggle-button"><span data-icon="power"></span><span>开启共享</span></button></div><div class="address-row" id="address-row" hidden><div><small>其他设备访问</small><strong id="address"></strong></div><button id="copy-address" class="icon-button" aria-label="复制链接" data-icon="copy"></button><button id="qr" class="icon-button" aria-label="显示二维码" data-icon="qr"></button><button id="open-local" class="local-button">本机打开</button></div><div id="visitor-sharing" hidden><span data-icon="shield"></span><span>正在共享</span><span id="visitor-address"></span></div></div></section>
<main id="chat" aria-label="聊天记录"><div id="timeline"></div></main><button id="new-messages" hidden>有新内容 ↓</button>
<div id="upload-status" class="upload-status" hidden role="status"><div><span id="upload-label"></span><button id="cancel-upload">取消上传</button></div><progress id="upload-progress" max="100" value="0"></progress></div>
<footer class="composer"><form id="message-form"><button type="button" id="attach" class="attach-button" aria-label="发送文件或图片" aria-expanded="false" data-icon="plus-circle"></button><textarea id="message-input" rows="1" maxlength="4000" aria-label="输入消息" placeholder="输入消息…"></textarea><button type="submit" id="send" class="send-button">发送</button></form><div class="composer-note"><span id="composer-status">开启共享后可发送消息</span><span id="text-counter">0 / 4000</span></div><div id="attachment-tray" hidden><button id="pick-image"><span data-icon="image"></span>图片</button><button id="pick-file"><span data-icon="folder"></span>文件</button></div></footer>
<input id="file-input" type="file" multiple hidden><input id="image-input" type="file" accept="image/*" multiple hidden>
</div><div id="toast" role="status"></div><div id="drop-zone" class="drop-zone" hidden><div><span data-icon="upload"></span><strong id="drop-title">松开即可上传</strong><p id="drop-detail">支持多个文件、图片和视频</p></div></div>
<dialog id="file-dialog" class="file-dialog"><div class="dialog-header"><h2>文件列表 <span id="file-count">0</span></h2><button class="icon-button" data-close="file-dialog" aria-label="关闭文件列表" data-icon="close"></button></div><div class="file-tabs"><button class="active" data-file-tab="all">全部</button><button data-file-tab="sent">已发送</button><button data-file-tab="received">已接收</button></div><label class="search"><span data-icon="search"></span><input id="file-search" type="search" placeholder="搜索文件或上传者" aria-label="搜索文件或上传者"></label><div class="file-toolbar"><label><input id="select-all" type="checkbox"><span id="selection-label">全选</span></label><div><button id="batch-download">下载所选</button><button id="batch-remove" class="danger">移除所选</button><button id="clear" class="danger">清空列表</button></div></div><div class="file-columns"><span>文件</span><span>上传者</span><span>操作</span></div><div id="file-list"></div><div class="file-footer"><span id="file-total"></span><span id="file-note">原文件保留</span></div></dialog>
<dialog id="info-dialog"><div class="dialog-header"><h2 id="info-title"></h2><button class="icon-button" data-close="info-dialog" aria-label="关闭弹窗" data-icon="close"></button></div><div id="info-content"></div></dialog>
<dialog id="confirm-dialog"><h2 id="confirm-title"></h2><p id="confirm-text"></p><div class="dialog-actions"><button class="subtle" id="cancel-confirm">取消</button><button class="danger-solid" id="confirm-action">确认移除</button></div></dialog>
<dialog id="settings-dialog" aria-labelledby="settings-title"><div class="dialog-header"><h2 id="settings-title">设置</h2><button class="icon-button" data-close="settings-dialog" aria-label="关闭设置" data-icon="close"></button></div><div class="host-settings"><label class="settings-option"><span>关闭共享后清理所有共享内容</span><input type="checkbox" id="clear-on-stop" role="switch"></label><p>开启后，关闭共享会清空文字、共享列表和 APP 内的接收副本。手机原文件及已另存文件保留。</p></div><label class="language-option"><span>语言</span><select id="language-choice" aria-label="语言"><option value="system">跟随系统</option><option value="zh">简体中文</option><option value="en">English</option></select></label><section id="permission-options" class="permission-options"><h3>权限管理</h3><button id="install-permission"><span>安装应用<small id="install-permission-state"></small></span><b>去设置</b></button><button id="notification-permission"><span>共享通知<small id="notification-permission-state"></small></span><b>去设置</b></button><button id="app-permissions"><span>应用权限设置</span><b>打开</b></button><p>打开其他应用时，自动提供所选文件的临时读取权限。</p></section><p class="settings-credit">NoxShare · @NoxLeo</p></dialog>
<dialog id="copy-dialog" aria-labelledby="copy-title"><div class="dialog-header"><h2 id="copy-title">文字操作</h2><button class="icon-button" data-close="copy-dialog" aria-label="关闭文字操作" data-icon="close"></button></div><p id="copy-preview"></p><div class="copy-actions"><button id="copy-text-action">复制文字</button><button id="copy-link-action" hidden>复制链接</button><button id="open-link-action" hidden>打开网页</button></div></dialog>
<dialog id="media-dialog" class="media-dialog" aria-labelledby="media-title"><div class="media-header"><div><h2 id="media-title"></h2><span id="media-meta"></span></div><button id="close-media" class="icon-button" aria-label="关闭预览" data-icon="close"></button></div><div id="media-stage" class="media-stage"></div><p id="media-status" role="status"></p><div class="media-tools"><button id="media-zoom">放大</button><button id="media-save">保存文件</button></div></dialog>
<script src="i18n-translations.js"></script><script src="i18n.js"></script><script src="qrcode.js"></script><script src="app.js"></script></body></html>
